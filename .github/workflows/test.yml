name: Test APK on Emulator

on:
  workflow_call:
    inputs:
      build-run-id:
        description: 'Run ID of the build.yml workflow that uploaded debug APKs'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build-run-id:
        description: 'Run ID of the build.yml workflow to download APKs from'
        required: true
        type: string

jobs:
  instrumentation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ── All parameters that affect snapshot compatibility ──
    # Changing any value here triggers a cache miss via the hash in the cache key.
    env:
      EMU_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x1920
      EMU_DISK_SIZE: 2G
      EMU_HEAP_SIZE: 1G

    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
        arch: [x86_64]
        target: [google_apis]

    steps:
      # ── Download pre-built debug APKs from build.yml ──
      # Must specify run-id: workflow_call child jobs need explicit run-id to access
      # parent workflow's artifacts, even within the same run.
      - name: Download debug APKs
        uses: actions/download-artifact@v4
        with:
          name: debug-apks
          path: apks/
          run-id: ${{ inputs.build-run-id || github.run_id }}

      # ── Verify APKs exist ──
      # download-artifact@v4 normally extracts ZIP artifacts automatically.
      # If extraction failed, we detect ZIP files here and unzip them.
      - name: Verify APKs
        run: |
          echo "=== Directory listing ==="
          ls -lR apks/ || echo "NOTE: apks/ not found or empty"
          echo ""

          # Detect ZIP files (artifact may not have been extracted)
          ZIP_COUNT=$(find apks/ -name "*.zip" 2>/dev/null | wc -l)
          if [ "$ZIP_COUNT" -gt 0 ]; then
            echo "⚠️  Found $ZIP_COUNT ZIP file(s) — artifact was NOT extracted"
            find apks/ -name "*.zip" -exec ls -lh {} \;
            echo "Unzipping..."
            find apks/ -name "*.zip" -exec sh -c 'cd "$(dirname "$1")" && unzip -o "$(basename "$1")"' _ {} \;
            echo "=== After unzip ==="
            ls -lR apks/
            echo ""
          fi

          APK_COUNT=$(find apks/ -name "*.apk" 2>/dev/null | wc -l)
          echo "APK count: $APK_COUNT"
          find apks/ -name "*.apk" 2>/dev/null -exec ls -lh {} \;
          if [ "$APK_COUNT" -lt 2 ]; then
            echo "❌ Expected 2 APK files (app + test), found $APK_COUNT"
            exit 1
          fi
          echo "✅ APKs ready"

      # ── Enable KVM (required for hardware acceleration on Linux) ──
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Hash all AVD params → cache key ──
      # Changing any parameter (api-level, arch, target, emulator-options,
      # disk-size, heap-size) produces a different SHA256 → cache miss → rebuild.
      - name: Compute AVD params hash
        id: emu-hash
        run: |
          echo "hash=$(echo '${{ matrix.api-level }} ${{ matrix.arch }} ${{ matrix.target }} ${{ env.EMU_OPTIONS }} ${{ env.EMU_DISK_SIZE }} ${{ env.EMU_HEAP_SIZE }}' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # ── AVD cache ──
      # Strategy: cache a CLEAN emulator snapshot (no app installed).
      # The Create step below only runs on cache miss and produces a pristine
      # snapshot. The Run step uses -no-snapshot-save to never overwrite it,
      # keeping the cache reusable across every build → 100% hit rate after
      # the first run.
      # Cache key is a SHA256 of all AVD parameters → changing anything
      # (api-level, arch, target, GPU, skin, disk-size, etc.) forces a miss.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ steps.emu-hash.outputs.hash }}-v2

      # ── Create clean AVD + snapshot (only on cache miss) ──
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          disk-size: ${{ env.EMU_DISK_SIZE }}
          heap-size: ${{ env.EMU_HEAP_SIZE }}
          emulator-options: ${{ env.EMU_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot generated for caching."

      # ── Write test script to file ──
      # android-emulator-runner@v2 executes each line as a separate sh -c,
      # so variables/functions cannot span lines. We write the script to a
      # file and run it as a single shell invocation.
      - name: Write test script
        run: |
          cat > test-script.sh << 'SCRIPT_EOF'
          #!/bin/sh
          set -eu

          APKS="apks"
          echo "Searching APKs in $PWD/$APKS ..."
          ls -la "$APKS"/

          MAIN_APK="$(find "$APKS" -name '*.apk' ! -name '*androidTest*' ! -name '*test*' | head -1)"
          TEST_APK="$(find "$APKS" -name '*androidTest*.apk' -o -name '*test*.apk' | head -1)"

          # Trap: capture logcat on any exit (install failure, crash, normal)
          capture_logcat() {
            {
              echo "=== logcat (errors) ==="
              adb logcat -d -s AndroidRuntime:E System.err:W '*:F' DEBUG:I ActivityManager:I 2>/dev/null || true
              echo ""
              echo "=== logcat (package) ==="
              adb logcat -d 2>/dev/null | grep -E "io\.github\.dreamandroid" || echo "(no matching lines)"
              echo ""
              echo "=== tombstone (native crash) ==="
              adb shell ls -t /data/tombstones/ 2>/dev/null | head -3 | while read f; do
                echo "--- $f ---"
                adb shell cat "/data/tombstones/$f" 2>/dev/null || true
              done
            } > logcat.txt
          }
          trap capture_logcat EXIT

          # Uninstall old versions first (snapshot may contain stale app with mismatched signature)
          echo "Cleaning old packages..."
          adb uninstall io.github.dreamandroid.local || true
          adb uninstall io.github.dreamandroid.local.test || true

          echo "Installing: $MAIN_APK"
          adb install -r -g "$MAIN_APK"

          echo "Installing: $TEST_APK"
          adb install -r -g "$TEST_APK"

          echo "Running tests..."

          # Capture full instrumentation output so we can detect failures
          # that am instrument masks (e.g. app process crash still returns 0).
          INSTR_OUT="$(adb shell am instrument -w -r \
            -e class io.github.dreamandroid.local.AppLaunchInstrumentationTest \
            io.github.dreamandroid.local.test/androidx.test.runner.AndroidJUnitRunner 2>&1)" || true
          echo "$INSTR_OUT"

          # Parse: detect any test failure
          # - "FAILURES!!!" = standard JUnit runner failure summary
          # - INSTRUMENTATION_STATUS_CODE: -2 = individual test failed
          # - INSTRUMENTATION_RESULT: shortMsg= = process crash
          FAILED=0
          if echo "$INSTR_OUT" | grep -q "FAILURES!!!"; then
            echo "❌ Test runner reported failures"
            FAILED=1
          fi
          if echo "$INSTR_OUT" | grep -q "INSTRUMENTATION_STATUS_CODE: -2"; then
            echo "❌ Individual test returned failure status (-2)"
            FAILED=1
          fi
          if echo "$INSTR_OUT" | grep -q "INSTRUMENTATION_RESULT: shortMsg="; then
            echo "❌ Instrumentation result contains error message"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ TESTS FAILED"
            exit 1
          fi
          echo "✅ All tests passed"
          SCRIPT_EOF
          chmod +x test-script.sh

      # ── Run tests ──
      # Boots from cached clean snapshot (< 30s). -no-snapshot-save leaves
      # the snapshot untouched so the cache stays valid for next build.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          disk-size: ${{ env.EMU_DISK_SIZE }}
          heap-size: ${{ env.EMU_HEAP_SIZE }}
          emulator-options: -no-snapshot-save ${{ env.EMU_OPTIONS }}
          disable-animations: true
          script: sh ./test-script.sh

      # ── Capture screenshots of each bottom-navigation tab ──
      # Best-effort: adb failures here are treated as warnings, not errors.
      - name: Capture tab screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          # Ensure app is running
          adb shell am start -n io.github.dreamandroid.local/.MainActivity 2>/dev/null || echo "WARNING: app start failed"
          sleep 4

          mkdir -p screenshots

          # 5-tab bottom navigation on 1080x1920 emulator:
          # Each tab occupies 1080/5 = 216px wide, centers at 108,324,540,756,972
          # Bottom nav center Y ~ 1840
          TABS="Models:108:1840 Queue:324:1840 Generate:540:1840 Upscale:756:1840 Browse:972:1840"

          for ENTRY in $TABS; do
            NAME="$(echo "$ENTRY" | cut -d: -f1)"
            X="$(echo "$ENTRY" | cut -d: -f2)"
            Y="$(echo "$ENTRY" | cut -d: -f3)"
            echo "Switching to $NAME tab (tap $X,$Y)..."
            adb shell input tap "$X" "$Y" || echo "WARNING: tap $NAME failed"
            sleep 1.5
            adb shell screencap -p "/sdcard/tab_${NAME}.png" 2>/dev/null && \
              adb pull "/sdcard/tab_${NAME}.png" "screenshots/" 2>/dev/null && \
              echo "✅ Captured $NAME" || \
              echo "WARNING: screencap/pull $NAME failed"
          done

          echo "=== Screenshots captured ==="
          ls -l screenshots/ || echo "WARNING: no screenshots directory"

      # ── Upload tab screenshots ──
      - name: Upload tab screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab-screenshots-${{ matrix.api-level }}-${{ matrix.target }}
          path: screenshots/
          retention-days: 7

      # ── Upload logcat (always) ──
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ matrix.api-level }}-${{ matrix.target }}
          path: logcat.txt
          retention-days: 7

      # ── Upload test reports (always) ──
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.api-level }}-${{ matrix.target }}
          path: app/build/reports/androidTests/connected/**
          retention-days: 7
